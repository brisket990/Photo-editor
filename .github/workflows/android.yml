name: Appli Android
on:
  push:
    branches: [main]
    paths: [index.html, 'android/**', .github/workflows/android.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Copier la page dans l'appli
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: Reconstituer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 et KEYSTORE_PASSWORD manquants : ajoute-les dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Compiler l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk RetoucheurEXIF.apk
          gh release create "v1.0.${{ github.run_number }}" RetoucheurEXIF.apk \
            --title "Retoucheur EXIF 1.0.${{ github.run_number }}" \
            --notes "APK Android à installer sur le téléphone. Lien permanent vers la dernière version : https://github.com/${{ github.repository }}/releases/latest/download/RetoucheurEXIF.apk" \
            --latest
