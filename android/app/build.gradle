plugins {
    id 'com.android.application'
}

def vCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()

android {
    namespace 'io.github.brisket990.retoucheur'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.brisket990.retoucheur'
        minSdk 30
        targetSdk 34
        versionCode vCode
        versionName "1.0.${vCode}"
    }

    signingConfigs {
        release {
            // La clé n'est jamais dans le dépôt : GitHub Actions la reconstitue
            // à partir des secrets KEYSTORE_BASE64 et KEYSTORE_PASSWORD.
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'retoucheur'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
